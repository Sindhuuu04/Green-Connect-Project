spring.application.name=green-connect-backend

# --- In-memory H2 database for local development ---
# Swap these for MySQL/Postgres settings when you're ready to deploy.
spring.datasource.url=jdbc:h2:mem:greenconnect
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allow the frontend (served separately) to call this API during development
spring.mvc.cors.allowed-origins=*

server.port=8080
